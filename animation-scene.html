<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
        <title>Radioactive Signals</title>
    </head>
    <body>
        <a-scene>
            <!-- Set the sky -->
            <a-sky color="lightblue"></a-sky>
            <a-box 
            color="red"
            scale="2 2 2"
            animation="
            property:position;
            from:0 2 -5;
            to:5 2 0;
            loop:true;
            dir:alternate;"
            ></a-box>
            <a-sphere
            position="-5 2 -5"
            scale="2 2 2"
            animation="
            property:color;
            from:#FF0000;
            to:#0000FF;
            loop:true;
            dir:alternate;
            "
            ></a-sphere>

        </a-scene>
    </body>
</html>
