<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
        <title>Radioactive Signals</title>
    </head>
    <body>
        <a-scene>
            <!-- Set the sky -->
            <a-sky color="lightblue"></a-sky>
            <a-box 
            positon="-5 -5 -5"
            scale="2 2 2"
            animation="
            property:color;
            from:red;
            to:blue;
            loop:true;
            dir:alternate;"></a-box>

        </a-scene>
    </body>
</html>
